set timeout=3
set default=0

# Bring up real graphics so GRUB can hand the kernel a framebuffer tag.
insmod all_video
insmod gfxterm
set gfxmode=auto
loadfont unicode
terminal_output gfxterm

# Keep that graphics mode when jumping into the kernel.
set gfxpayload=keep

menuentry "PIEG OS" {
    multiboot2 /boot/pieg.elf
    boot
}
